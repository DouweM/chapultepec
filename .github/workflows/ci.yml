name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - run: uv sync --group dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - run: uv sync --group dev
      # Harness-free SDK unit tests.
      - run: uv run pytest tests/sdk -q
      # Integration test with the Home Assistant test harness (installed after
      # the SDK run so its global autouse fixtures don't touch the sync tests).
      - run: uv pip install homeassistant pytest-homeassistant-custom-component
      - run: uv run pytest tests/integration -q

  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master
      - uses: hacs/action@main
        with:
          category: integration
